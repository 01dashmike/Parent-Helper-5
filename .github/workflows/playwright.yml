name: Playwright Responsive Tests

on:
  push:
    branches: [ main ]
  workflow_dispatch: # allow manual runs
  # Optional: uncomment if you want to trigger after Railway deploys
  # deployment_status:
  #   types: [ success ]

jobs:
  test:
    name: Responsive layout & live UI checks
    runs-on: ubuntu-latest

    steps:
      - name: 🧱 Checkout repository
        uses: actions/checkout@v4

      - name: 🧩 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Install dependencies
        run: |
          npm ci
          npx playwright install --with-deps

      - name: 🌍 Run Playwright tests against Railway
        env:
          BASE_URL: "https://parent-helper-app-parenthelper5.up.railway.app"
        run: |
          npx playwright test tests/live.spec.ts --reporter=list

      - name: 📸 Upload screenshots (always run)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-screenshots
          path: screenshots/
