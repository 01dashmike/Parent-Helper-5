name: UI Regression Check
on:
  push:
    branches: [ main ]

jobs:
  verify-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps
      - run: BASE_URL="https://parent-helper-app-parenthelper5.up.railway.app" npx playwright test
