name: "Self-Heal Baseline"
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

jobs:
  update-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npx playwright test --update-snapshots
      - run: git add tests/__screenshots__ && git commit -m "chore: update UI baselines"
      - run: git push origin main
